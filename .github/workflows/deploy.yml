name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build
        env:
          VITE_NODE_ENV: ${{ vars.VITE_NODE_ENV }}
          VITE_NODE_PUBLIC_URL: ${{ vars.VITE_NODE_PUBLIC_URL }}
          VITE_NODE_BUILD_VERSION: ${{ vars.VITE_NODE_BUILD_VERSION }}
          VITE_DEFAULT_LANGUAGE: ${{ vars.VITE_DEFAULT_LANGUAGE }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TELEGRAM_CHAT_ID: ${{ vars.VITE_TELEGRAM_CHAT_ID }}

          VITE_HOTJAR_ID: ${{ secrets.VITE_HOTJAR_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_API_CLIENT_KEY: ${{ secrets.VITE_API_CLIENT_KEY }}
          VITE_API_CLIENT_SECRET: ${{ secrets.VITE_API_CLIENT_SECRET }}
          VITE_API_SECRET_KEY: ${{ secrets.VITE_API_SECRET_KEY }}
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
